{% extends "base.html" %}

{% block extra_head %}
<style>
  .switch-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #444;
    transition: .3s;
    border-radius: 20px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: var(--primary);
  }
  input:checked + .slider:before {
    transform: translateX(16px);
  }
  .switch-label {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    transition: .3s;
  }
  input:checked ~ .label-sim { color: var(--success); }
  input:not(:checked) ~ .label-nao { color: white; }
</style>
{% endblock %}

{% block title %}Nova Receita{% endblock %}
{% block page_title %}Lançar Nova Receita{% endblock %}

{% block content %}
<div class="card max-w-2xl mx-auto">
  <form action="/lancamentos/inserir" method="post">
  <input type="hidden" name="csrftoken" value="{{ csrf_token(request) }}">
    <input type="hidden" name="tipo" value="1">
    
    <div class="form-group">
      <label class="form-label">Descrição da Receita</label>
      <input type="text" name="descricao" class="form-control" placeholder="Ex: Salário" required autofocus>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Valor</label>
        <div class="flex items-center gap-2">
          <span class="text-success font-bold">+ R$</span>
          <input type="text" name="valor" class="form-control" placeholder="0,00" onkeyup="formatCurrency(this)" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Data</label>
        <input type="date" name="data" class="form-control" value="{{ hoje }}" required>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Conta de Destino</label>
        <select name="conta" class="form-control" required>
          <optgroup label="Conta Corrente">
            {% for c in contas_todas if c.tipo_conta == 1 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }} (Conta Corrente)</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Cartões de Crédito">
            {% for c in contas_todas if c.tipo_conta == 4 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }} (Cartão de Crédito)</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Dinheiro/Carteira">
            {% for c in contas_todas if c.tipo_conta == 2 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }} (Dinheiro)</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Investimentos">
            {% for c in contas_todas if c.tipo_conta == 5 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }} (Investimentos)</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Financeiro">
            {% for c in contas_todas if c.tipo_conta == 3 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }} (Financeiro)</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Outros">
            {% for c in contas_todas if c.tipo_conta == 6 %}
            <option value="{{ c.conta_id }}">{{ c.nome_conta }}</option>
            {% endfor %}
          </optgroup>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select name="categoria" class="form-control">
          <option value="">Sem Categoria</option>
          {% for cat in categorias if cat.categorias_classe in [0, 1, None] %}
          <option value="{{ cat.categorias_id }}">
            {% if cat.categorias_pai_id %} &nbsp;&nbsp;&nbsp;&nbsp; {{ cat.categorias_nome }} {% else %} {{ cat.categorias_nome }} {% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-group">
      <button type="button" class="btn btn-sm btn-ghost" id="btnAtivarProjeto" onclick="toggleProjetoCampo('projetoCampoWrap','btnAtivarProjeto', true)">+ Vincular a projeto</button>
      <div id="projetoCampoWrap" style="display:none; margin-top:10px;">
        <label class="form-label">Projeto</label>
        <select name="projeto" id="projeto_select" class="form-control" onchange="onProjetoSelectChange(this, 'novoProjetoBox')">
          <option value="-1">Sem projeto</option>
          {% for p in projetos %}
          <option value="{{ p.projeto_id }}">{{ p.projetos_nome }}</option>
          {% endfor %}
          <option value="__novo__">+ Criar novo projeto...</option>
        </select>
        <div id="novoProjetoBox" style="display:none; margin-top:10px; padding:12px; border:1px dashed #444; border-radius:8px; background:rgba(255,255,255,0.02);">
          <div class="form-grid-2">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Nome do projeto</label>
              <input type="text" id="novoProjetoNome" class="form-control" placeholder="Ex: Reforma, Viagem...">
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Cor</label>
              <input type="color" id="novoProjetoCor" class="form-control" value="#6366f1" style="height:42px; padding:4px;">
            </div>
          </div>
          <div class="flex justify-end gap-2 mt-3">
            <button type="button" class="btn btn-sm btn-ghost" onclick="cancelarNovoProjeto('projeto_select','novoProjetoBox')">Cancelar</button>
            <button type="button" class="btn btn-sm btn-primary" onclick="salvarNovoProjeto('projeto_select','novoProjetoBox','novoProjetoNome','novoProjetoCor')">Salvar projeto</button>
          </div>
          <div class="text-danger" style="font-size:12px; margin-top:6px; display:none;"></div>
        </div>
        <div style="margin-top:6px;">
          <button type="button" class="btn btn-sm btn-ghost" onclick="toggleProjetoCampo('projetoCampoWrap','btnAtivarProjeto', false)" style="padding:0; font-size:12px;">Ocultar projeto</button>
        </div>
      </div>
    </div>

    <div class="form-group mb-4">
      <div class="flex items-center gap-2">
        <label class="form-label mb-0" style="margin-right: 4px;">Repetir Lançamento?</label>
        <label class="switch-wrapper">
          <span class="switch-label label-nao">não</span>
          <div class="switch">
            <input type="checkbox" id="checkRepetir" name="repetir" onchange="toggleRepetir()">
            <span class="slider"></span>
          </div>
          <span class="switch-label label-sim">sim</span>
        </label>
      </div>
    </div>

    <div id="divRepeticao" style="display: none; border: 1px dashed #444; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: rgba(255,255,255,0.02);">
      <div class="form-group">
        <label class="form-label">Modo de Repetição</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modo_repeticao" value="parcelado" checked onchange="toggleModoRepeticao()">
            <span>Parcelar</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="modo_repeticao" value="recorrente" onchange="toggleModoRepeticao()">
            <span>Recorrência</span>
          </label>
        </div>
      </div>

      <div id="divParcelado" class="form-grid-2">
        <div class="form-group mb-0">
          <label class="form-label">Número de Parcelas</label>
          <div class="flex gap-4 items-center">
            <input type="number" name="num_parcelas" class="form-control" min="2" max="120" value="2" style="width: 80px;">
            
            <div class="flex gap-4 items-center bg-dark-lighter p-2 rounded border border-gray-700">
              <span class="form-label mb-0" style="font-size: 11px;">O valor é:</span>
              <label class="flex items-center gap-2 mb-0 cursor-pointer">
                <input type="radio" name="valor_total_ou_parcela" value="total" checked> 
                <span style="font-size: 12px;">Total</span>
              </label>
              <label class="flex items-center gap-2 mb-0 cursor-pointer">
                <input type="radio" name="valor_total_ou_parcela" value="parcela"> 
                <span style="font-size: 12px;">Parcela</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div id="divRecorrente" class="form-grid-2" style="display: none;">
        <div class="form-group mb-0">
          <label class="form-label">Frequência</label>
          <select name="frequencia" class="form-control">
            <option value="mensal">Mensal</option>
            <option value="semanal">Semanal</option>
            <option value="anual">Anual</option>
          </select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Ocorrências</label>
          <input type="number" name="ocorrencias" class="form-control" min="1" max="60" value="12">
        </div>
      </div>
    </div>

    <hr>

    <div class="form-group mb-6 flex items-center gap-2">
      <label class="form-label mb-0" style="margin-right: 4px;">Já recebeu/efetivou hoje?</label>
      <label class="switch-wrapper">
        <span class="switch-label label-nao">não</span>
        <div class="switch">
          <input type="checkbox" id="checkEfetivado" onchange="handleEfetivadoToggle()">
          <span class="slider"></span>
        </div>
        <span class="switch-label label-sim">sim</span>
      </label>
      <input type="hidden" name="efetivado" id="input_efetivado" value="0">
    </div>

    <div id="divDataEfetivado" class="form-group mb-6" style="display:none">
      <label class="form-label">Data de Efetivação</label>
      <input type="date" name="data_efetivado" class="form-control" value="{{ hoje }}">
    </div>

    <hr>

    <div class="flex justify-end gap-3">
      <a href="/dashboard" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar Receita</button>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function handleEfetivadoToggle() {
    const isEfetivado = document.getElementById('checkEfetivado').checked;
    document.getElementById('input_efetivado').value = isEfetivado ? "1" : "0";
    document.getElementById('divDataEfetivado').style.display = isEfetivado ? "" : "none";
  }

  function toggleRepetir() {
    const isRepetir = document.getElementById('checkRepetir').checked;
    document.getElementById('divRepeticao').style.display = isRepetir ? "" : "none";
  }

  function toggleModoRepeticao() {
    const modo = document.querySelector('input[name="modo_repeticao"]:checked').value;
    document.getElementById('divParcelado').style.display = (modo === 'parcelado') ? "" : "none";
    document.getElementById('divRecorrente').style.display = (modo === 'recorrente') ? "" : "none";
  }

  function toggleNovoProjeto(boxId, force) {
    const box = document.getElementById(boxId);
    if (!box) return;
    const show = typeof force === 'boolean' ? force : box.style.display === 'none';
    box.style.display = show ? '' : 'none';
    if (!show) { const err = (box && box.querySelector('.text-danger')) || document.getElementById('novoProjetoErro'); if (err) { err.style.display = 'none'; err.textContent = ''; } }
  }
  function toggleProjetoCampo(wrapId, btnId, show) {
    const wrap = document.getElementById(wrapId);
    const btn = document.getElementById(btnId);
    if (!wrap) return;
    wrap.style.display = show ? '' : 'none';
    if (btn) btn.style.display = show ? 'none' : '';
    if (!show) { const sel = wrap.querySelector('select[name="projeto"]'); if (sel) sel.value = '-1'; const box = wrap.querySelector('[id*="novoProjetoBox"], [id*="NovoProjetoBox"]'); if (box) toggleNovoProjeto(box.id, false); }
  }
  function onProjetoSelectChange(sel, boxId) { if (sel && sel.value === '__novo__') { sel.value = '-1'; toggleNovoProjeto(boxId, true); } }
  function cancelarNovoProjeto(selectId, boxId) { const sel = document.getElementById(selectId); if (sel && sel.value === '__novo__') sel.value = '-1'; toggleNovoProjeto(boxId, false); }
  async function salvarNovoProjeto(selectId, boxId, nomeId, corId) {
    const nomeEl = document.getElementById(nomeId);
    const corEl = document.getElementById(corId);
    const box = document.getElementById(boxId);
    const err = (box && box.querySelector('.text-danger')) || document.getElementById('novoProjetoErro');
    const nome = (nomeEl.value || '').trim();
    const cor = (corEl.value || '#6366f1').trim();
    if (!nome) { err.textContent = 'Informe o nome do projeto.'; err.style.display = ''; return; }
    err.style.display = 'none'; err.textContent = '';
    try {
      const csrf = (document.querySelector('input[name="csrftoken"]') || {}).value || '';
      const body = new URLSearchParams({ nome, cor, csrftoken: csrf });
      const r = await fetch('/projetos/api/novo', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrf }, body });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.erro || ('Erro ' + r.status));
      const sel = document.getElementById(selectId);
      const opt = document.createElement('option');
      opt.value = data.id; opt.textContent = data.nome; opt.selected = true;
      const novoOpt = Array.from(sel.options).find(o => o.value === '__novo__');
      if (novoOpt) sel.insertBefore(opt, novoOpt); else sel.appendChild(opt);
      sel.value = String(data.id);
      nomeEl.value = ''; corEl.value = '#6366f1';
      toggleNovoProjeto(boxId, false);
    } catch (e) { err.textContent = e.message || 'Erro ao criar projeto.'; err.style.display = ''; }
  }
</script>
{% endblock %}
