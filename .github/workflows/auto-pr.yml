name: Auto PR e Auto-Merge (dev -> main)

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar PR e ativar Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git fetch origin main dev
          AHEAD=$(git rev-list --count origin/main..origin/dev)
          if [ "$AHEAD" -eq 0 ]; then
            echo "Nenhum commit novo em dev à frente de main. Nada a fazer."
            exit 0
          fi

          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Criando novo Pull Request de dev para main..."
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "chore(release): deploy automático da branch dev" \
              --body "Pull Request gerado automaticamente pela esteira de CI/CD.")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          else
            echo "PR #$PR_NUMBER já está aberto. Atualizando..."
          fi

          gh pr merge "$PR_NUMBER" --auto --merge