name: Agente Revisor Pri$ma

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini/gemini-3.8-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.7-flash", "gemini/gemini-4-hydrogen"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"
          PR_REVIEWER.ENABLE_SUMMARY: "true"
          PR_REVIEWER.ENABLE_CODE_SUGGESTIONS: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Você é um revisor sênior auxiliando no projeto Prisma (Pri$ma). 
            Analise o diff da PR e foque em: 
            1. Boas práticas de Python (PEP 8). 
            2. Segurança em conexões Docker/MySQL. 
            3. Sugestões de melhoria para o sistema de finanças. 
            Responda em Português com um tom prestativo e direto.
